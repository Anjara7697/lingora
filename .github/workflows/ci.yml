name: CI

on:
  pull_request:
  push:
    branches: [main]

# Une seule exécution par branche : une nouvelle poussée annule la précédente.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint, migrations, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: lingora
          POSTGRES_PASSWORD: lingora
          POSTGRES_DB: lingora
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lingora -d lingora"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://lingora:lingora@localhost:5432/lingora
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Installer les dépendances
        run: pip install -e ".[dev]"
      - name: Lint (ruff)
        run: ruff check .
      - name: Migrations (montée, puis aucun écart modèles / migrations)
        run: |
          alembic upgrade head
          alembic check
      - name: Tests (base dédiée lingora_test, créée automatiquement)
        run: pytest -q

  frontend:
    name: Frontend (lint, types, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Types (génère d'abord les types de routes Next.js, absents d'un clone neuf)
        run: npm run typecheck
      - name: Build
        run: npm run build

  docker:
    name: Docker (compose + images)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Configuration Compose valide, sans fichier .env
        run: docker compose config --quiet
      - name: Construire les images
        run: docker compose build backend frontend
