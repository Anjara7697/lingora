# Développement local. Aucun fichier .env n'est nécessaire : tout a une valeur par défaut.
# Pour personnaliser, créez un .env (voir .env.example) : Compose le lit automatiquement.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lingora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lingora}
      POSTGRES_DB: ${POSTGRES_DB:-lingora}
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://lingora:lingora@db:5432/lingora}
      JWT_SECRET: ${JWT_SECRET:-dev-only-insecure-secret-change-me-please}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      STORAGE_DIR: /data/storage
      AI_PROVIDER: ${AI_PROVIDER:-demo}
      # Développement : l'email de réinitialisation est écrit dans les logs (docker compose logs backend).
      # Production : EMAIL_BACKEND=smtp + SMTP_HOST/PORT/USER/PASSWORD, EMAIL_FROM et APP_BASE_URL.
      EMAIL_BACKEND: ${EMAIL_BACKEND:-console}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:3000}
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
    volumes: ["./backend:/app", "media:/data/storage"]
    command: sh -c "alembic upgrade head && python -m app.seed && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports: ["3000:3000"]
    depends_on: [backend]

volumes:
  pgdata:
  media:  # enregistrements audio du Speaking Lab (jamais dans Git)
